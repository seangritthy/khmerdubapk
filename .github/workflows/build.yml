name: Build KhmerDub Standalone APK

on:
  push:
    tags:
      - 'standalone-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.6)'
        required: true
        default: '1.0.6'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk \
            build-essential libssl-dev libffi-dev \
            zlib1g-dev libncurses5-dev libbz2-dev \
            libreadline-dev libsqlite3-dev libgdbm-dev \
            liblzma-dev tk-dev uuid-dev autoconf libtool \
            libltdl-dev cmake ninja-build ccache

      - name: Install Buildozer & p4a
        run: |
          pip install --upgrade pip
          pip install buildozer python-for-android cython==0.29.37

      - name: Set up Android SDK & NDK
        run: |
          # Accept all licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools" \
            "ndk;25.2.9519653" || true

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      - name: Build APK
        env:
          ANDROIDAPI: "34"
          NDKAPI: "21"
        run: |
          buildozer android debug 2>&1 | tee build.log

      - name: Find built APK
        id: find_apk
        run: |
          APK=$(find bin/ -name "*.apk" | head -1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "APK: $APK"
          ls -lh bin/ || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KhmerDub-Standalone-APK
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: warn

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find_apk.outputs.apk_path }}
          name: KhmerDub Standalone ${{ github.ref_name }}
          body: |
            ## KhmerDub Standalone APK
            Full standalone APK with embedded Python + AI dubbing engine.
            
            **Includes:**
            - Python 3.x runtime
            - Flask HTTP server
            - yt-dlp (real downloads)
            - edge-tts (Khmer TTS)
            - pydub (audio processing)
            - deep-translator (translation)
            - FFmpeg ARM64
            
            **No Termux required** — fully self-contained.
